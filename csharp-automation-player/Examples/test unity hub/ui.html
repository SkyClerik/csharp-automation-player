<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Local Unity Hub</title>
    <style>
        body { background: #2d2d2d; color: #fff; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        h2 { margin-top: 0; color: #f0f0f0; }
        #project-list { height: 200px; overflow-y: auto; background: #1e1e1e; border: 1px solid #3f3f46; border-radius: 6px; padding: 10px; margin-bottom: 15px; }
        .project-item { padding: 8px; border-bottom: 1px solid #2d2d2d; }
        .name { font-weight: bold; font-size: 14px; color: #fff; }
        .path { font-size: 11px; color: #888; }
        .version { font-size: 12px; color: #4ec9b0; margin-top: 2px; }
        .input-container { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; background: #1e1e1e; border: 1px solid #3f3f46; color: #fff; border-radius: 6px; }
        .button-container { display: flex; justify-content: flex-end; gap: 10px; }
        button { padding: 10px 20px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #btn-select { background: #3f3e46; }
        #btn-launch { background: #00adb5; }
        #btn-launch:hover { background: #008f96; }
        #btn-clear { background: #393e46; }
    </style>
</head>
<body>
    <h2>My Local Unity Hub</h2>
    <div id="project-list">
        <div style="padding:10px; color:#888;">Кэш пуст. Нажмите «Выбрать проект»...</div>
    </div>
    <div class="input-container">
        <input type="text" id="project-path-input" placeholder="Путь к проекту появится здесь..." readonly />
        <button id="btn-select">📂 Выбрать проект</button>
    </div>
    <div class="button-container">
        <button id="btn-clear">❌ Очистить кэш</button>
        <button id="btn-launch">🚀 ЗАПУСТИТЬ ВЫБРАННЫЙ</button>
    </div>
</body>
</html>
