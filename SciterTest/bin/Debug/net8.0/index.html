
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset='utf-8'> <!-- Явно говорим Sciter использовать UTF-8 -->
            <style>
                body { background: #f0f0f0; font-family: sans-serif; text-align: center; padding-top: 50px; }
                button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
                button:hover { background: #0056b3; }
            </style>
        </head>
        <body>
            <h1>Привет мир</h1>
            <button id='close-btn'>OK</button>
            <script type='module'>
                document.on('click', '#close-btn', () => {
                    Window.this.close();
                });
            </script>
        </body>
        </html>
